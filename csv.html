<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>CSV Processor</title>
    <link rel="stylesheet" href="popup.css">
</head>

<body class="csv">

    <script src="headerLoader.js"></script>




    <section id="csvUploadSection" class="actions" style="gap:12px; margin-top:10px;">
        <button id="btnUploadCsv" style="margin-top: 15px;">Upload CSV</button>
        <input type="file" id="fileCsv" accept=".csv,text/csv" style="display:none">
    </section>

    <div class="csv-table-wrapper">
        <div class="csv-table-scroller">
            <table id="csvTable" class="abuse-table">
                <thead>
                    <tr></tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <div id="columnProcessor" style="display:none; text-align:center; margin:20px;">
        <h3>Select column to process</h3>
        <select id="columnSelect" style="margin-bottom:10px;"></select>
        <div>
            <button id="processColumnBtn" type="button">Process column</button>
        </div>
    </div>

    <script src="csv.js"></script>
</body>

</html>
