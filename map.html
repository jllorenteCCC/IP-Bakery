<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <title>IP Map</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="libs/leaflet/leaflet.css" rel="stylesheet" />
    <style>
        html,
        body,
        #map {
            height: 100%;
            margin: 0;
        }

        /* Pin tipo “globo” (sin imágenes) usando divIcon */
        .pin {
            width: 22px;
            height: 22px;
            border-radius: 50% 50% 50% 0;
            transform: rotate(-45deg);
            background: var(--color, #2a7);
            border: 2px solid #fff;
            box-shadow: 0 2px 6px rgba(0, 0, 0, .25);
            position: relative;
        }

        .pin::after {
            content: "";
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #fff;
            position: absolute;
            top: 7px;
            left: 7px;
        }

        .leaflet-popup-content {
            margin: 6px 8px;
            line-height: 1.2;
        }

        .legenda {
            position: absolute;
            z-index: 400;
            right: 10px;
            top: 10px;
            background: #fff;
            padding: 8px 10px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, .2);
            font: 12px/1.2 Arial, sans-serif;
        }

        .dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 6px;
            vertical-align: middle;
        }

        /* === Estilo popups === */
        .popup-content {
            font-family: Arial, sans-serif;
            font-size: 13px;
            line-height: 1.4;
            color: #222;
            max-width: 250px;
        }

        .popup-ip {
            font-size: 14px;
            font-weight: bold;
            color: #004085;
            margin-bottom: 2px;
        }

        .popup-location {
            font-size: 13px;
            color: #555;
            margin-bottom: 6px;
        }

        .popup-detail {
            font-size: 12px;
            margin: 2px 0;
        }

        .leaflet-popup-content-wrapper {
            border-radius: 10px;
            padding: 8px 10px;
        }

        .leaflet-popup-tip {
            background: white;
        }
    </style>
</head>

<body>
    <div id="map"></div>
    <div class="legenda">
        <div><span class="dot" style="background:#95a5a6"></span>0%</div>
        <div><span class="dot" style="background:#2ecc71"></span>1–25%</div>
        <div><span class="dot" style="background:#f1c40f"></span>26–50%</div>
        <div><span class="dot" style="background:#e67e22"></span>51–74%</div>
        <div><span class="dot" style="background:#e74c3c"></span>75–100%</div>
    </div>
    <link rel="stylesheet" href="libs/leaflet/leaflet.css" />
    <script src="libs/leaflet/leaflet.js"></script>
    <script src="map.js"></script>
</body>

</html>
